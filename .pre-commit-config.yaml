# ==============================================================================
# pre-commit 钩子配置（仓库根）
# 触发时机：git commit 提交前自动执行
# 执行顺序：Ruff 自动修复 → Ruff 格式化 → 认知复杂度强校验
# 任意一步失败，直接阻断提交，代码无法入库
#
# 分级门禁（分层解耦，本文件只管「提交前秒级」层）：
#   提交前：ruff check --fix → ruff format → 认知复杂度（complexity_precommit.py，
#     仅扫本次暂存的 lumina Python 文件，阈值取 quality-gate.toml）
#   全量四项质量门禁（含 AST 原生行数统计）下沉到 CI/手动：
#     uv run --directory lumina python -m tools.run_quality_gate
#
# 说明：
#   - 本仓库为多项目 monorepo（spb2*/MoBA 等只读上游 + lumina 原创区）。
#     pre-commit 约定在 git 仓库根查找本文件，故所有钩子一律用 files 限定
#     只扫描 lumina/ 原创区，绝不触碰上游只读树。
#   - ruff 钩子 rev 与 lumina/pyproject.toml 精确锁定的 ruff 版本对齐，
#     避免「提交钩子格式化结果 ≠ uv run ruff format」的分叉。
#   - local 钩子 entry 均为 uv run + Python 模块：不依赖 bash/PATH，Windows
#     与 POSIX 行为一致（--directory lumina 保证 cwd 与包导入正确）。
# ==============================================================================
repos:
  # Ruff 官方钩子：静态检查 + 自动修复 + 格式化（仅 lumina/ 文件）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # --cache-dir 镜像 quality-gate.toml [cache]：lumina/{root}/{ruff}
      # （ruff-pre-commit 不支持 hook.env；钩子 cwd=仓库根）。
      - id: ruff
        name: ruff-lint (lumina)
        args: [ "--fix", "--config", "lumina/pyproject.toml", "--cache-dir", "lumina/.cache/ruff" ]
        files: ^lumina/
      - id: ruff-format
        name: ruff-format (lumina)
        args: [ "--config", "lumina/pyproject.toml", "--cache-dir", "lumina/.cache/ruff" ]
        files: ^lumina/

  # 本地钩子：认知复杂度强校验（只处理本次暂存的 lumina Python 文件）
  - repo: local
    hooks:
      - id: cognitive-complexity
        name: 认知复杂度强校验 (lumina)
        language: system
        entry: uv run --directory lumina python -m tools.complexity_precommit
        types: [ python ]
        files: ^lumina/
        stages: [ pre-commit ]
