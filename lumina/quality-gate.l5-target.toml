# ==============================================================================
# 代码质量门禁配置文件（全量门禁的唯一真值源）— L5 工业档
# 执行器：tools.run_quality_gate
#          → reporting.python_gate / checks.native.gate / naming.gate / performance.gate
# 提交前：tools.complexity_precommit
# 镜像备份：quality-gate.l5-target.toml（与本文件同步维护）
# ==============================================================================

[cache]
root = ".cache"
pytest = "pytest"
mypy = "mypy"
ruff = "ruff"
hypothesis = "hypothesis"
uv = "uv"
complexipy_vendor = ".complexipy_cache"

# ------------------------------ Hypothesis ------------------------------
# 产品 Enc/Dec 必须在 tests/python/product/ 消费本节；否则视为门禁配置空转。
[hypothesis]
default_profile = "dev"

[hypothesis.profiles.dev]
max_examples = 1000
deadline_ms = 3000
print_blob = true
persist_examples = true
derandomize = true

[hypothesis.profiles.ci]
max_examples = 500
deadline_ms = 3000
print_blob = true
derandomize = true
persist_examples = false

[hypothesis.profiles.ha]
max_examples = 5000
deadline_ms = 60000
derandomize = true
print_blob = true
stateful_step_count = 200
max_examples_per_run = 1000
suppress_health_check = false
persist_examples = true

# ------------------------------ Python 扫描 ------------------------------
# theory/ 属 F1–F7，不进结构门禁。runtime/ 落地后纳入 include_paths。
[scan]
include_paths = [
    "tools",
    "tests",
]

[thresholds]
# 认知复杂度档位：L1=≤5(Simple) · L2=≤10 · L3=≤15 · L4=≤20 · L5=≤25
cognitive_complexity_level = "L1"
max_cognitive_complexity = 5
max_cyclomatic_complexity = 8
max_control_nesting_depth = 3
max_function_physical_lines = 50
max_function_count_per_file = 8
max_file_physical_lines = 300
max_code_duplication_ratio = 3
max_cyclic_dependencies = 0
max_module_fan_out = 8
max_inheritance_depth = 4
max_duplicate_code_blocks = 0
max_unchecked_exception_paths = 0
max_global_state_variables = 2
max_none_reference_risk = 0

[line_counting]
count_blank_lines = false
count_comment_lines = false

[features]
enable_file_lines_check = true
enable_function_count_check = true
enable_function_lines_check = true
enable_cognitive_complexity_check = true
enable_cyclomatic_complexity_check = true
enable_control_nesting_check = true
enable_recursion_check = true
enable_architecture_check = true
enable_ha_check = true

[report]
document_id = "LUM-QG-PY"
json_report_path = "tests/reports/complexipy.json"
markdown_report_path = "tests/reports/quality-gate.md"
summary_json_path = "tests/reports/quality-gate.json"
title = "Luminas Python 质量门禁 / Quality Gate"
description = "控制项 / Controls：认知·圈复杂度、嵌套、文件/函数规模、自递归、架构（环/扇出/继承/克隆）、高可用（异常/全局态/空引用）。"
show_full_detail = true
violation_headers = ["目标 / Target", "问题 / Finding", "当前值 / Actual", "上限 / Limit"]
function_headers = ["函数 / Function", "物理行数 / Physical lines", "认知复杂度 / Cognitive complexity"]
pass_text = "通过 / PASS — 全部已启用控制项均在阈值内。"
fail_text = "未通过 / FAIL — 质量门禁阻断；请修复后再合并/发布。"

[exclusions]
file_patterns = [".cache/**", "__pycache__/**"]
function_names = ["main"]
recursion_allowed_functions = []

[comment_standard]
# L5（工业最高档）= L0 邻接存在 ⊂ L4 why 线索 ⊂ 产品核心数值契约文件头
# level=L5 时下列五开关必须为 true；禁止局部降级。
level = "L5"
require_file_banner = true
require_function_doc = true
require_header_decl_doc = true
require_inline_on_complex = true
require_why_semantics = true
inline_exclude_file_patterns = ["theory/**", "tests/**"]
why_include_file_patterns = ["**"]
# L5 核心：algorithm 产品路径 + 产品 bind 文件头须含数值契约线索
require_numeric_contract_banner = true
numeric_contract_file_patterns = [
    "algorithm/luma_kv.h",
    "algorithm/luma_kv_*.c",
    "wrapper/luma_bind_native.cpp",
]
numeric_contract_markers = [
    "L5",
    "2-ulp",
    "ulp",
    "bit-exact",
    "有限",
    "无损",
    "预言机",
    "LUMA_ULP",
]

[naming_standard]
enable = true
# L5（文件命名质量工业最高档）= 文件名规则 ⊂ 符号 shape ⊂ 宏 LUMA_* ⊂ include guard
# level=L5 时四开关必须为 true，且禁止 baseline 宏别名。
level = "L5"
require_filename_rules = true
require_symbol_rules = true
require_macro_rules = true
require_include_guard = true
allow_baseline_macro_aliases = false
file_allowlist = []
include_paths = ["algorithm", "kernel", "wrapper"]
file_patterns = ["**/tests/**", "**/.cache/**"]

# ------------------------------ 目录结构质量 L5 ------------------------------
# 物理三层（ARC-101）+ 内容平面（ARC-001 §4.1）+ 文档域 + ASCII snake_case。
# level=L5 时下列五开关必须为 true；禁止局部降级。
[layout_standard]
enable = true
level = "L5"
require_product_layers = true
require_content_planes = true
require_docs_domains = true
require_ascii_dir_names = true
forbid_banned_roots = true
product_layers = ["algorithm", "kernel", "wrapper"]
content_planes = ["tools", "tests", "docs", "theory", "research", "experiments", "refs"]
docs_domains = ["docs/arc", "docs/eng", "docs/res", "docs/pm"]
banned_roots = ["common", "include", "src", "lib"]
ascii_scan_roots = ["algorithm", "kernel", "wrapper", "docs"]
ascii_ignore_dir_names = [".cache", ".venv", "__pycache__", "build"]

# ------------------------------ 文档质量 L5 ------------------------------
# 架构设计 / 技术（工程）/ 实验研究；写作规则见 docs/README.md。
# L5 = 元信息五字段 ⊂ 状态用语 ⊂ 权威技能对齐 ⊂ H1 编号 ⊂ 编号章节。
# level=L5 时下列五开关必须为 true；禁止局部降级。
[document_standard]
enable = true
level = "L5"
require_meta_table = true
require_status_vocab = true
require_skill_alignment = true
require_h1_doc_id = true
require_numbered_section = true
status_vocab = ["生效", "草案", "计划"]

[document_standard.architecture]
# 架构设计文档
level = "L5"
include_paths = ["docs/arc"]
file_glob = "LUM-ARC-*.md"
required_skill = "lumina-arc-skill"
doc_id_prefix = "LUM-ARC-"

[document_standard.technical]
# 技术文档（工程域 LUM-ENG-*）
level = "L5"
include_paths = ["docs/eng"]
file_glob = "LUM-ENG-*.md"
required_skill = "lumina-eng-skill"
doc_id_prefix = "LUM-ENG-"

[document_standard.research]
# 实验研究文档
level = "L5"
include_paths = ["docs/res"]
file_glob = "LUM-RES-*.md"
required_skill = "lumina-res-skill"
doc_id_prefix = "LUM-RES-"

# ------------------------------ 鲁棒性与异常容错测试 L5 ------------------------------
# L5 = HA 全开 ⊂ 未检异常=0 ⊂ 空引用=0 ⊂ 全局态封顶 ⊂ 产品/C L2 边界测试存在。
# level=L5 时下列五开关必须为 true；禁止局部降级。
[robustness_standard]
enable = true
level = "L5"
require_ha_check = true
require_zero_unchecked_exceptions = true
require_zero_none_risk = true
require_global_state_cap = true
require_boundary_tests = true
max_unchecked_exception_paths = 0
max_none_reference_risk = 0
max_global_state_variables = 2
boundary_files = [
    "tests/c/test_luma_kv.c",
    "tests/python/product/test_kv_properties.py",
]
boundary_markers = ["L2", "ERR_ARG", "LUMA_ERR", "pytest.mark.l2"]

# ------------------------------ 架构合规性测试 L5 ------------------------------
# L5 = 架构检查全开 ⊂ 环=0 ⊂ 扇出/继承/克隆封顶 ⊂ 架构单测制品存在。
[architecture_standard]
enable = true
level = "L5"
require_architecture_check = true
require_zero_cycles = true
require_fan_out_cap = true
require_inheritance_cap = true
require_clone_cap = true
require_architecture_tests = true
max_cyclic_dependencies = 0
max_module_fan_out = 8
max_inheritance_depth = 4
max_duplicate_code_blocks = 0
architecture_test_files = ["tests/python/checks/architecture/test_import_graph.py"]
architecture_test_markers = ["cycle", "fan_out", "inheritance", "duplication"]

# ------------------------------ 长稳与疲劳测试 L5 ------------------------------
# L5 = perf 全开 ⊂ 延迟回归≤2% ⊂ warmup+timed 协议 ⊂ 疲劳轮次≥100 ⊂ 长稳用例存在。
[endurance_standard]
enable = true
level = "L5"
require_perf_enable = true
require_latency_cap = true
require_protocol_warmup_timed = true
require_endurance_tests = true
require_min_fatigue_rounds = true
max_latency_regression = 0.02
min_fatigue_rounds = 100
protocol_file = "tools/checks/performance/protocol.py"
protocol_markers = ["warmup", "timed", "WARMUP_RUNS", "TIMED_RUNS"]
endurance_test_files = ["tests/python/product/test_kv_endurance.py"]
endurance_markers = ["endurance", "fatigue", "FATIGUE_ROUNDS", "100"]

# ------------------------------ 端到端集成测试 L5 ------------------------------
# L5 = Python L3 bind+kernel ⊂ C 产品路径 ⊂ native/roundtrip 线索。
[integration_standard]
enable = true
level = "L5"
require_python_l3_tests = true
require_c_product_tests = true
require_native_marker = true
require_roundtrip_marker = true
require_bind_kernel_agreement = true
python_integration_files = ["tests/python/product/test_kernels.py"]
python_integration_markers = ["pytest.mark.l3", "pytest.mark.native", "roundtrip"]
c_integration_files = ["tests/c/test_luma_kv.c"]
c_integration_markers = ["L1", "L5", "encode", "decode"]

# ------------------------------ 性能 L4 ------------------------------
# 工作负载必须命中产品 Binding（或文档化的核入口），禁止仅以 list-saxpy 顶替。
[perf_standard]
enable = true
max_latency_regression = 0.02
baseline_path = "tests/python/baselines/l4_perf_baseline.json"
# 编排层读取的分数键（实现于 checks/performance/workloads.py）
required_score_keys = ["luma_kv_encode_decode_f32"]

# ------------------------------ C/C++/CUDA ------------------------------
[c_scan]
include_paths = ["algorithm", "kernel", "wrapper"]

[c_thresholds]
max_header_physical_lines = 300
max_impl_physical_lines = 500
max_function_physical_lines = 80
max_functions_per_file = 15
max_loop_count_per_function = 0
max_loop_nesting_depth = 1
# 对齐 lumina-eng-skill §结构度量；native.gate 须实现后生效，禁止先放宽
max_cyclomatic_complexity = 5
max_if_nesting_depth = 2

[c_features]
enable_file_lines_check = true
enable_function_count_check = true
enable_function_lines_check = true
enable_loop_check = true
enable_loop_nesting_check = true
enable_recursion_check = true
enable_cyclomatic_check = true
enable_if_nesting_check = true

[c_exclusions]
file_patterns = ["**/tests/**", "**/.cache/**"]
loop_allowed_file_patterns = ["kernel/**", "wrapper/**"]
# 有损基线 / CUDA 核暂豁免 McCabe；产品 algorithm + _luma_native 强制 ≤5/≤2
complexity_exempt_file_patterns = [
    "kernel/**",
    "wrapper/luma_bind_baseline.cpp",
    "wrapper/luma_bind_cuda.cpp",
]
loop_allowed_functions = [
    "luma_kv_require_finite_f32",
    "luma_kv_require_finite_f64",
    "luma_kv_encode_f32",
    "luma_kv_decode_f32",
    "luma_kv_encode_runs",
    "luma_kv_decode_runs",
    "luma_kv_run_length",
    "luma_kv_expand_run",
]
recursion_allowed_functions = []
doc_comment_exempt_functions = []
