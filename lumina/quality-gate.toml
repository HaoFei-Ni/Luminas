# ==============================================================================
# 代码质量门禁配置文件（全量四项门禁的唯一真值源）
# 执行器：ci_quality_gate.py（读取本文件 + complexipy JSON + AST 原生行数测量）
# 阈值 / 开关 / 行数口径 / 排除规则统一在此声明。工具侧仅保留最小镜像配置：
#   - pyproject.toml 的 [tool.complexipy].paths 须与下方 [scan].include_paths
#     保持一致（供手动裸跑 uv run complexipy 时使用；正式入口 run_quality_gate.py
#     以 [scan].include_paths 为准显式传参）
#   - ruff / mypy / complexipy 的源码扫描范围统一为 tests + theory
# 修改门禁规则只需修改本文件，无需改动业务代码。
# ==============================================================================

# ------------------------------ 扫描范围（单一真值源） ------------------------------
[scan]
# 目录/文件均相对 lumina/ 解析；与 pyproject.toml [tool.complexipy].paths 保持一致
include_paths = ["tests", "theory"]

# ------------------------------ 阈值配置 ------------------------------
# 行业参考：
#   认知复杂度：≤10 优秀，≤15 良好，>20 高风险
#   单文件行数：≤200 优秀，≤400 可接受，>600 建议拆分
#   单文件函数数：≤10 优秀，≤12 可接受，过多说明模块职责发散
#   单函数行数：≤50 优秀，≤80 可接受，>100 建议拆分子函数
[thresholds]
# 认知复杂度上限（SonarQube 同款指标，反映人脑理解负担）；提交前强校验同用此值
max_cognitive_complexity = 15
# 单个 Python 文件物理总行数上限（口径见 [line_counting]）
max_file_physical_lines = 800
# 单个 Python 文件内允许的最大函数数量
max_function_count_per_file = 12
# 单个函数物理源码行数上限（口径见 [line_counting]）
max_function_physical_lines = 80

# ------------------------------ 行数统计口径（AST 原生测量） ------------------------------
# 只影响行数类校验（文件行数 / 函数行数）；认知复杂度与函数数量不随行数口径变化。
[line_counting]
# True=空行计入物理行数；False=不计入（推荐：物理行数衡量承载逻辑的代码量）
count_blank_lines = false
# True=纯注释行计入物理行数；False=不计入（行尾注释属于代码行，始终计入）
count_comment_lines = false

# ------------------------------ 功能开关 ------------------------------
# 每项校验可独立启用/禁用，灵活适配新项目/存量项目
[features]
enable_file_lines_check = true
enable_function_count_check = true
enable_function_lines_check = true
enable_cognitive_complexity_check = true

# ------------------------------ 报告输出配置 ------------------------------
[report]
# complexipy 原始 JSON 数据文件路径（机器读取，复杂度数据源）
json_report_path = "complexipy-report.json"
# Markdown 格式报告输出路径（人工审阅，含健康度概览/违规汇总/全量明细）
markdown_report_path = "complexipy-report.md"
# 报告主标题
title = "代码复杂度质量报告"
# 报告描述说明
description = "校验维度：认知复杂度、文件行数（AST 原生）、单文件函数数量、函数行数（AST 原生）"
# 是否输出全量函数明细表格
show_full_detail = true
# 违规汇总表格表头
violation_headers = ["检查对象", "问题类型", "当前值", "阈值上限"]
# 函数明细表格表头
function_headers = ["函数名称", "物理行数", "认知复杂度"]
# 校验通过提示文案
pass_text = "✅ 全部校验通过"
# 校验未通过提示文案
fail_text = "❌ 质量门禁未通过，阻断提交/发布"

# ------------------------------ 排除规则 ------------------------------
# 排除规则与 ruff / mypy / complexipy 对齐：工具只扫 tests + theory（见
# pyproject.toml），因此此处默认不做文件级额外排除；确需豁免再按需追加。
[exclusions]
# 排除校验的文件路径模式（fnmatch，相对 lumina/，POSIX 风格）
file_patterns = []
# 排除校验的函数名（如入口函数、样板代码）
function_names = ["main"]
