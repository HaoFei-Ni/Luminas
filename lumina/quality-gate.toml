# ==============================================================================
# 代码质量门禁配置文件（全量门禁的唯一真值源）
# 执行器：tools.ci_quality_gate / tools.c_quality_gate / naming_gate / perf_gate
#         （经 tools.run_quality_gate）；提交前认知复杂度见 complexity_precommit
# 阈值 / 开关 / 行数口径 / 排除 / 缓存 / Hypothesis 统一在此声明。工具侧仅镜像：
#   - pyproject.toml [tool.complexipy].paths ↔ [scan].include_paths
#   - ruff / mypy / pytest 的 cache_dir = {cache.root}/{cache.<tool>}
#   - pre-commit ruff：`--cache-dir lumina/{cache.root}/{cache.ruff}`（cwd=仓库根）
# 修改门禁规则只需改本文件，勿在业务代码里再写阈值。
# ==============================================================================

# ------------------------------ 统一工具缓存 ------------------------------
# pytest / mypy / ruff 原生键在 pyproject；hypothesis / complexipy 由 tools 读本节。
[cache]
root = ".cache"
pytest = "pytest"
mypy = "mypy"
ruff = "ruff"
hypothesis = "hypothesis"
uv = "uv"
# complexipy 硬编码相对进程 cwd 的目录名；正式入口 cwd=root，落在 root 下
complexipy_vendor = ".complexipy_cache"

# ------------------------------ Hypothesis profile（无法写入 pyproject） ------------------------------
# 官方插件不读 hypothesis_* ini（hypothesis#2434）；conftest 只加载本节。
[hypothesis]
default_profile = "dev"

[hypothesis.profiles.dev]
# max_examples：单属性最大样本数（覆盖度↑耗时↑）；本地常用 500~1000，深度回归可至 2000
max_examples = 1500
# deadline_ms：单用例超时毫秒；dev 可 1000~5000
deadline_ms = 2500
# print_blob：失败时打印完整反例，便于本地定位
print_blob = true
# persist_examples：持久化失败例优先复现；稳定后可关，避免历史污染
persist_examples = true

[hypothesis.profiles.ci]
# CI 速度优先：样本宜 200~500；夜间回归可提至 1000
max_examples = 300
# CI 超时宜 ≤3000，避免堵流水线
deadline_ms = 3000
print_blob = true
# derandomize：固定种子，CI 必须可复现
derandomize = true
# CI 不落库，保持无状态
persist_examples = false

# ------------------------------ Python 扫描范围 ------------------------------
# 相对 lumina/；wrapper/ 为 C++/pybind，不进 Python 门禁
[scan]
include_paths = [
    "tools",
    "tests",
    "theory",
]

# ------------------------------ Python 阈值 ------------------------------
# 最优目标（渐进）：认知≤8 / 文件行≤300 / 函数数≤8 / 函数行≤50 / 圈≤8 / 嵌套≤3
# 现行：存量可过；认知/函数数/圈/嵌套仍高于最优，拆分后下调。
[thresholds]
max_cognitive_complexity = 15
max_file_physical_lines = 300
max_function_count_per_file = 12
max_function_physical_lines = 60
max_cyclomatic_complexity = 17
max_control_nesting_depth = 5

[line_counting]
count_blank_lines = false
count_comment_lines = false

# 架构边界 / docstring / 性能反模式由 ruff（TID/ERA/PERF/D）承担，不在此重复。
# Python 循环：编排层允许（无 enable_loop_check）；C 侧循环见 [c_features]。
[features]
enable_file_lines_check = true
enable_function_count_check = true
enable_function_lines_check = true
enable_cognitive_complexity_check = true
enable_cyclomatic_complexity_check = true
enable_control_nesting_check = true
enable_recursion_check = true

# ------------------------------ 报告 ------------------------------
[report]
json_report_path = "complexipy-report.json"
markdown_report_path = "complexipy-report.md"
title = "代码复杂度质量报告"
description = "校验维度：认知/圈复杂度、控制嵌套、文件/函数行数、单文件函数数、自递归"
show_full_detail = true
violation_headers = ["检查对象", "问题类型", "当前值", "阈值上限"]
function_headers = ["函数名称", "物理行数", "认知复杂度"]
pass_text = "✅ 全部校验通过"
fail_text = "❌ 质量门禁未通过，阻断提交/发布"

[exclusions]
file_patterns = [".cache/**", "__pycache__/**"]
function_names = ["main"]
recursion_allowed_functions = []

# ------------------------------ 注释（全语言；C 文档开关真值源） ------------------------------
# C：覆盖 [c_features] 中的 banner/函数文档/头文件声明/行内注释开关。
# Python：ruff D + ci 行内 #（require_inline_on_complex）；tests/theory 排除裸循环。
[comment_standard]
require_file_banner = true
require_function_doc = true
require_header_decl_doc = true
require_inline_on_complex = true
require_why_semantics = true
inline_exclude_file_patterns = ["theory/**", "tests/**"]
why_include_file_patterns = ["**"]

# ------------------------------ 命名（LUM-ENG-101；规则在 naming_rules.py） ------------------------------
[naming_standard]
enable = true
allow_baseline_macro_aliases = false
file_allowlist = []
include_paths = ["algorithm", "kernel", "wrapper"]
file_patterns = ["**/tests/**", "**/.cache/**"]

# ------------------------------ 性能 L4 ------------------------------
[perf_standard]
enable = true
max_latency_regression = 0.02
baseline_path = "tests/python/baselines/l4_perf_baseline.json"

# ------------------------------ C/C++/CUDA 结构度量 ------------------------------
# algorithm/：运行时零循环（有限性扫描见 loop_allowed_functions）。
# kernel|wrapper：允许单层循环，禁止嵌套与递归。
[c_scan]
include_paths = ["algorithm", "kernel", "wrapper"]

[c_thresholds]
max_header_physical_lines = 300
max_impl_physical_lines = 500
max_function_physical_lines = 80
max_functions_per_file = 15
max_loop_count_per_function = 0
max_loop_nesting_depth = 1

# 文档/行内开关勿写于此：真值源 [comment_standard]（c_quality_gate.comment_features 覆盖）。
[c_features]
enable_file_lines_check = true
enable_function_count_check = true
enable_function_lines_check = true
enable_loop_check = true
enable_loop_nesting_check = true
enable_recursion_check = true

[c_exclusions]
file_patterns = ["**/tests/**", "**/.cache/**"]
loop_allowed_file_patterns = ["kernel/**", "wrapper/**"]
# 变长有限性门禁；SIMD/LUT Enc 落地后删除并清空本表白名单
loop_allowed_functions = [
    "luma_kv_require_finite_f32",
    "luma_kv_require_finite_f64",
]
recursion_allowed_functions = []
doc_comment_exempt_functions = []
