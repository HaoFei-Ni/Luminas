# ==============================================================================
# lumina / Python 工具链配置 — pytest / mypy / ruff 门禁统一入口
#
# 职责边界：
#   - 本文件只管 Python 侧门禁（静态检查 + 类型检查 + Python 测试），不参与 CMake 构建
#   - C/CUDA/pybind 走 lumina/CMakeLists.txt（superproject），产物 _luma_native /
#     _luma_cuda 落在 outputs/build/lumina/wrapper
#   - Python 在 Luminas 只做 glue / 测试：禁止在 Python 里写算子或 KV 数值算法
#     （eng-standard-skill § Python scheduler）。新调度/入口代码也纳入 mypy 门禁
#
# 门禁命令（在 lumina 目录下执行）：
#   uv run ruff check .                    # 静态规范检查
#   uv run ruff format . --check           # 格式校验
#   uv run mypy .                          # 类型检查（含门禁脚本 + tests + theory）
#   uv run pytest                          # Python 测试（纯 Python 必绿；原生扩展未构建时 skip）
#   HYPOTHESIS_PROFILE=ci uv run pytest -n auto --junitxml=.cache/pytest/junit.xml
#   uv run complexipy && uv run python -m tools.ci_quality_gate   # 全量四项门禁 + 健康度报告
#   或：uv run python -m tools.run_quality_gate
# 提交级秒级门禁（ruff/fmt/认知复杂度）由根 .pre-commit-config.yaml 统一执行
#
# 数值门限：以 lumina/tests/c/* 为准，Python 工程测试不授予 lossless 论文声明
# ==============================================================================

[project]
name = "lumina"
version = "0.1.0"
description = "Luminas lossless KV-cache compression — Python gate (pytest/mypy/ruff)"
requires-python = ">=3.12"
# 无 pip 安装产物；依赖仅用于锁 Python 工具链版本（uv.lock，LUM-ENG-201）
dependencies = []

# ------------------------------ 开发依赖（PEP 621 标准写法，UV 原生兼容） ------------------------------
# 版本策略：精确锁版（==）锁定工具链，避免意外升级导致的断链。
# 生产级正式稳定版核查于 PyPI（2026-09-04）：
#   ruff 0.16.6 / mypy 2.3.1 / complexipy 8.0.0 / pre-commit 4.6.2
# 其余包同为当日 uv 解析的最新正式版；升级需人工审阅 changelog 后显式改此表，
# 与 uv.lock 保持一致（uv sync 会自动同步 lockfile）。
[project.optional-dependencies]
dev = [
    "numpy==2.5.2",          # 数值计算依赖，测试与胶水层调用原生扩展时使用
    "pytest==9.1.1",         # 测试框架，执行 Python 层单元/集成/边界测试
    "pytest-xdist==3.8.0",   # 分布式并行测试，加速多用例执行
    "pytest-cov==7.1.0",     # 覆盖率插件（LUM-ENG test-matrix：Python 侧 --cov）
    "hypothesis==6.167.1",   # 模糊测试用例生成，覆盖边界与异常输入
    "mypy==2.3.1",           # 静态类型检查，强制公共 API 类型注解完整
    "ruff==0.16.6",          # 静态代码检查 + 自动格式化
    "complexipy==8.0.0",     # 认知复杂度统计（JSON 输出为扁平逐函数 schema，见 tools/quality_metrics.py）
    "pre-commit==4.6.2",     # Git 提交前置钩子，代码提交前强制执行全套门禁
]

# ------------------------------ 常用命令（统一入口，文档化） ------------------------------
# 说明：uv 不支持 pyproject 内的任务别名表（[tool.uv.scripts] 提案见
# astral-sh/uv#5903，2026-09 仍 open；对象式 {cmd,shell} 为 PDM 语法，uv 不认）。
# 为团队统一执行方式，以下命令一律直接 uv run + 可执行命令；多步链式门禁
# 收敛到 pre-commit（根 .pre-commit-config.yaml）与 CI，避免维护不生效的别名配置。
#
# 分级门禁总览（分层解耦）：
#   提交前（pre-commit，秒级）：ruff check --fix → ruff format → 认知复杂度强校验
#     （tools.complexity_precommit，仅扫本次暂存 lumina Python 文件）
#   全量质量门禁（CI/本地手动，含 AST 原生行数统计的四项校验 + Markdown 报告）：
#     请执行根 .pre-commit-config.yaml 的等价流程或：
#     uv run python -m tools.run_quality_gate
# 所有命令均在 lumina 目录下执行：
#   uv run ruff check .                                  # 仅 Ruff 静态代码规范检查
#   uv run ruff check . --fix                            # Ruff 自动修复所有可自动修复项
#   uv run ruff format .                                 # Ruff 全量格式化，仅改排版不改逻辑
#   uv run python -m tools.run_quality_gate              # Python 四项 + C 结构度量
#   uv run python -m tools.c_quality_gate                # 仅 C/CUDA（algorithm/ + kernel/）
# 提交钩子已在根 .pre-commit-config.yaml 统一执行 ruff/fmt/认知复杂度门禁。

# ==============================================================================
# pytest 测试框架配置（工业级默认）
# ==============================================================================
# Hypothesis 属性测试的 settings 无法写进 pyproject：官方 pytest 插件不提供
# hypothesis_* ini 键（HypothesisWorks/hypothesis#2434）。profile 数值真值源：
# quality-gate.toml [hypothesis]；conftest 只加载。切换：HYPOTHESIS_PROFILE=ci。
#
# 统一缓存真值源：quality-gate.toml [cache]；下方 cache_dir / cache-dir 必须等于
# ``{cache.root}/{cache.<tool>}``（工具原生键只能写在本文件，禁止在代码里再写一份）。

# 设计约定：
#   - 纯 Python 用例必须始终可跑、通过（无 _luma_* 扩展时 exit 0，禁止「全 skip」exit 5）
#   - 依赖扩展的用例用 @pytest.mark.native / cuda + fixture importorskip，按测试跳过
#   - L1–L5 标记对齐 eng-standard-skill/references/test-matrix.md
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
cache_dir = ".cache/pytest"  # 镜像 quality-gate.toml [cache] root/pytest
# 扩展搜索路径：优先加载本地门禁脚本，再加载 CMake 构建输出的原生扩展
# 目录不存在或扩展未构建时，fixture 内 pytest.importorskip 按测试 skip（非整模块）
pythonpath = [
    ".",
    "../outputs/build/lumina/wrapper",
]
addopts = [
    "-ra",                 # 短摘要列出 skip/xfail/fail 原因
    "--strict-markers",    # 未注册 marker 直接失败，防止拼写漂移
    "--strict-config",     # 未知 ini 键直接失败，防止静默失效配置
    "--tb=short",          # CI/本地统一短回溯，可读且不刷屏
    "--durations=10",      # 报告最慢 10 条，便于抓性能回退
]
# 未实现的 xfail 必须失败，避免「永远 xfail」掩盖真实回归
xfail_strict = true
# 第三方警告一律升为错误；确有已知噪声时再按模块局部 filter
filterwarnings = [
    "error",
]
# JUnit 报告族：CI 解析用；本地默认不写文件，CI 加 --junitxml=...
junit_family = "xunit2"
# 注意：不要自定义 norecursedirs——pytest 会整表替换默认值（含 .hypothesis），
# 触发 Hypothesis 插件告警；在 filterwarnings=error 下会直接变 ERROR。
# 收集范围已由 testpaths=["tests/python"] 限定，无需再缩 norecursedirs。
markers = [
    "l1: unit-level numerical / pure-logic gate",
    "l2: boundary / ugly-input gate",
    "l3: bind + kernel integration",
    "l4: benchmark / perf gate (default CI via tools.perf_gate; 2 warmup + 5 timed, ≤2%)",
    "l5: 2-ulp lossless-numeric gate (product KV paths only)",
    "native: requires built _luma_native extension",
    "cuda: requires built _luma_cuda extension",
]

# ==============================================================================
# coverage.py（经 pytest-cov 驱动）
# 量测范围：lumina 原创 Python 公共面（门禁指标层）；不含上游 / theory 脚本
# ==============================================================================
[tool.coverage.run]
branch = true
# 公共可测面：tools.quality_metrics。wrapper/ 为 C++/pybind，无 Python 模块可纳入 --cov
source = ["tools.quality_metrics"]
omit = [
    "tests/*",
    "theory/*",
    ".cache/*",
    "tools/ci_quality_gate.py",
    "tools/run_quality_gate.py",
    "tools/complexity_precommit.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 对齐 eng-standard test-matrix「Public API」门槛；仅对 source 内模块生效
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ==============================================================================
# mypy 静态类型检查配置
# 严格模式：公共 API 必须完整类型注解；测试/数学脚本可局部豁免
# ==============================================================================
[tool.mypy]
python_version = "3.12"
strict = true                     # 全局严格模式，启用全部类型检查规则
show_error_codes = true           # 输出错误码，便于定位与豁免
warn_unused_configs = true        # 提示未使用的配置项，避免冗余配置
warn_unused_ignores = true        # 提示未生效的忽略规则，清理无效豁免
files = [
    "tools",
    "tests",
    "theory",
]  # 类型检查范围：门禁包 + 测试 + 理论脚本
# 严格模式细化规则
disallow_untyped_defs = true      # 禁止无类型注解的函数定义
disallow_incomplete_defs = true   # 禁止类型注解不完整的函数
warn_return_any = true            # 警告返回值为 Any 类型，避免类型逃逸
cache_dir = ".cache/mypy"  # 镜像 quality-gate.toml [cache] root/mypy
# 第三方库存根豁免，避免因缺失类型桩文件产生误报
[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

# hypothesis 为可选 dev 依赖：未安装时仅跑非属性测试，mypy 不因此报 import 错误
[[tool.mypy.overrides]]
module = ["hypothesis", "hypothesis.*"]
ignore_missing_imports = true

# ==============================================================================
# Ruff 完整配置
# 覆盖：语法、格式、命名、导入、文档、复杂度、安全、性能、异步、注解、冗余代码
# 分为两大能力：
#   1. lint：静态检查，发现问题并告警，可配置 CI/提交阻断
#   2. format：自动格式化，仅修改排版，不改变代码逻辑
# ==============================================================================
[tool.ruff]
target-version = "py312"        # 目标 Python 语法版本，决定支持的语法特性与规则范围
line-length = 120                # 单行最大字符长度，对应规则 E501；行业通用标准 120，兼顾可读性与屏幕适配
indent-width = 4                 # 缩进空格数，PEP8 官方标准 4 空格
# 全局排除目录，所有 Ruff 能力统一生效；与 mypy/complexipy 的扫描边界保持一致
# （均为运行缓存/编译产物，不含源码；源码范围对齐：tests + theory）
exclude = ["__pycache__", "*.pyc"]
cache-dir = ".cache/ruff"  # 镜像 quality-gate.toml [cache] root/ruff

# ------------------------------ Lint 规则集启用 ------------------------------
[tool.ruff.lint]
select = [
    "E",          # pycodestyle：基础语法格式错误（缩进、空格、换行、注释格式等）
    "F",          # pyflakes：静态逻辑检查（未使用导入、未定义变量、重复赋值等）
    "I",          # isort：导入语句排序、分组规范，统一 import 排版
    "N",          # flake8-naming：PEP8 命名规范校验，类/函数/变量/常量命名风格统一
    "D",          # pydocstyle：docstring 文档注释完整规范，强制公共 API 文档化
    "SIM",        # flake8-simplify：检测可简化的冗余逻辑，消除多余判断
    "B",          # bugbear：Python 高频易错陷阱检测，拦截低级 bug
    "S",          # bandit：静态安全漏洞扫描，识别危险函数与注入风险
    "PERF",       # flake8-perf：性能最佳实践检测，识别常见低效写法
    "C90",        # mccabe：McCabe 圈复杂度检测，规则 C901，衡量逻辑分支复杂度
    "PLR",        # pylint 移植：函数体量、嵌套深度、分支数、参数数等全套函数级约束
    "ANN",        # flake8-annotations：类型注解规范，强制注解完整性
    "TCH",        # flake8-type-checking：类型提示检查，辅助 mypy 类型校验
    "ASYNC",      # async 异步代码最佳实践，识别异步常见错误
    "ERA",        # eradicate：检测并清理注释掉的废弃代码块，避免死代码入库
    "INP",        # flake8-no-pep420：目录作包时须有 __init__.py（非 flake8-init；见下方 per-file）
    "TID",        # flake8-tidy-imports：禁止跨层导入（banned-api），替代无效的 lint.override/ban-imports
]
# 全局忽略规则
ignore = [
    "E501",      # 行长度告警交给 ruff format 管控，lint 阶段不重复告警
    "E741",      # 允许单字母变量名，兼容数学脚本、循环索引的工程惯例
    "D104",      # 魔法方法可不写 docstring（与 pydocstyle convention 配合）
    "D203",      # 允许 docstring 与其下方代码之间有空行（google 惯例冲突时豁免）
]

# ------------------------------ 分文件规则豁免 ------------------------------
# 按目录粒度灵活放宽，兼顾规范与开发效率
# 测试文件：不强制 fixture/测试函数的参数注解、不强制测试/函数 docstring；
#   S101（assert）/S311（随机）为测试惯例——断言即断言，测试本就该用 assert
# 数学脚本（theory/ 内 verify-*）：允许 # 注释替代 docstring 排版（D2xx/D4xx）、
#   数学符号标识符直接镜像论文公式（N803/N806）、对照脚本内联魔法数值（PLR2004）；
#   S101/S311：契约校验与显式播种的 Monte Carlo，非密码学场景
[tool.ruff.lint.per-file-ignores]
# INP001：tests/theory 为 pytest/脚本树，刻意不用包 __init__.py；正式可导入包再建 __init__.py
# lumina/tests/**：pre-commit 在仓库根调用时路径带 lumina/ 前缀，须与 tests/** 同等豁免
"tests/**" = ["ANN001", "ANN201", "ANN401", "D100", "D103", "D403", "INP001", "PLR2004", "S101", "S311"]
"lumina/tests/**" = ["ANN001", "ANN201", "ANN401", "D100", "D103", "D403", "INP001", "PLR2004", "S101", "S311"]
"theory/**" = ["ANN001", "D100", "D103", "D205", "D212", "D415", "INP001", "N803", "N806", "PLR2004", "S101", "S311"]
"lumina/theory/**" = ["ANN001", "D100", "D103", "D205", "D212", "D415", "INP001", "N803", "N806", "PLR2004", "S101", "S311"]

# ------------------------------ isort 导入排序配置 ------------------------------
[tool.ruff.lint.isort]
# 第一方模块：门禁脚本 + 验证树（wrapper/ 仅为 C++/pybind，无 Python 包名可声明）
known-first-party = [
    "tools",
    "tests",
    "theory",
]
force-single-line = false       # 不强制每个导入占一行，允许多行导入排版
combine-as-imports = true       # 合并同模块的 as 导入，优化导入排版

# ------------------------------ 分层依赖边界（TID251 banned-api） ------------------------------
# ruff 0.16 无 [[lint.override]] / ban-imports / pylint.max-lines；跨层禁止用 TID 全局声明。
# 门禁/胶水不得依赖验证树；分层行数阈值仍由 quality-gate.toml（AST）统一裁决。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tests" = { msg = "Do not import the tests tree from gate/production code (dependency must point downward)" }
"theory" = { msg = "Do not import theory scripts from gate/production code (dependency must point downward)" }

# ------------------------------ 命名规范配置 ------------------------------
# 注意：ruff 0.16 pep8-naming 仅支持 ignore-names / decorators；
# class-naming-style / function-naming-style / constant-naming-style 键不存在（会直接解析失败）。
[tool.ruff.lint.pep8-naming]
# 豁免：通用占位 + 循环索引 + KV 压缩领域惯用缩写
ignore-names = ["_", "ctx", "tmp", "i", "j", "k", "kv", "dim", "dtype", "seq", "err", "idx"]

# ------------------------------ Docstring 文档字符串规范 ------------------------------
# 规则集：D（pydocstyle）
# 管控范围：模块、类、函数/方法的三引号文档的格式、完整性、内容结构
[tool.ruff.lint.pydocstyle]
convention = "google"                 # docstring 风格标准，google 风格结构清晰、可读性强，工程界最通用
# 识别属性装饰器，被 @property 装饰的方法不强制写 docstring
property-decorators = ["property", "cached_property"]
# 注：ruff 的 pydocstyle 配置表不支持 add-ignore；D104/D203 已并入全局 lint.ignore

# ------------------------------ 文档行长度约束 ------------------------------
[tool.ruff.lint.pycodestyle]
max-doc-length = 100             # docstring 文档单行最大字符数，独立于代码行长度约束

# ------------------------------ McCabe 圈复杂度 ------------------------------
[tool.ruff.lint.mccabe]
# 单函数圈复杂度阈值；行业标准：≤10 低风险，>15 高风险，>20 严重缺陷
# 统计维度：if/elif/for/while/and/or/except/match-case，每增加一条独立路径复杂度+1
# 直接关联可测试性：复杂度越高，测试用例数量呈指数增长
max-complexity = 10

# ------------------------------ Pylint 函数级全套约束 ------------------------------
[tool.ruff.lint.pylint]
max-statements = 50        # 单函数最大 AST 语句数（注释空行不计）；控制函数体量，防止 Long Method 坏味道
max-branches = 12          # 单函数最大分支数；分支越多，测试路径爆炸，可测试性越差
max-nested-blocks = 4      # 控制块最大嵌套深度；人脑可读舒适上限 4 层，越深可读性可维护性越差
max-args = 6               # 函数最大入参数量；过多建议封装为数据类，提升可读性
max-locals = 15            # 函数内部最大局部变量数量；过多说明函数职责过载，违反单一职责
max-returns = 6            # 函数 return/yield 返回点最大数量；过多控制流混乱，阅读调试困难

# ------------------------------ 废弃注释代码治理 ------------------------------
# 规则集：ERA（eradicate）—— 禁止大段注释掉的死代码留在代码仓库。
# ruff 0.16 不存在 [tool.ruff.lint.eradicate] / [tool.ruff.lint.init] 配置表
# （whitelist-literals / max-lines / init-imports 均会 TOML 解析失败）。
# 使用内置默认：带 TODO/FIXME/NOTE 等说明性关键词的注释默认不误判。

# ------------------------------ 未合入提案说明（避免再引入失效配置） ------------------------------
# 1. [[tool.ruff.lint.override]] + ban-imports / pylint.max-lines：ruff 无此表；边界改用 TID251。
# 2. [tool.uv.scripts]：uv 0.12.9 仍不支持（astral-sh/uv#5903）；快捷命令见文件头注释 / Makefile。
# 3. pytest addopts 默认 --cov / cov_fail_under：本地默认应秒级可跑；覆盖率用
#    `uv run pytest --cov`（fail_under 已在 [tool.coverage.report]）；wrapper/ 无 Python 源，勿 --cov=wrapper。
# 4. [quality-gate.*] 勿写入本文件：真值源为 quality-gate.toml，避免双源漂移。

# ------------------------------ Ruff 格式化配置（重点说明） ------------------------------
# 功能：统一全项目代码排版风格，仅修改格式，绝对不改变代码逻辑
# 执行命令：uv run fmt 或 uv run ruff format .
# 与 lint 的区别：format 只负责“长得好不好看”，lint 负责“写得对不对、合不合规”
[tool.ruff.format]
quote-style = "double"          # 字符串引号风格：可选 double=双引号 / single=单引号
                                # 统一使用双引号，匹配 Google 代码风格，字符串嵌套时更易读
indent-style = "space"         # 缩进字符风格：可选 space=空格 / tab=制表符
                                # PEP8 官方标准使用空格，彻底避免不同编辑器/平台缩进显示不一致的问题
line-ending = "lf"             # 换行符格式：可选 lf=Unix风格 / crlf=Windows风格 / cr=旧Mac风格
                                # Git 仓库统一使用 lf，跨平台兼容，避免换行符差异导致的无意义 diff
skip-magic-trailing-comma = false  # false=保留 magic trailing comma（新版字段名；旧版名 magic-trailing-comma=true）
                                # 核心价值：优化 git diff，新增元素时仅改动新增行，无需修改上一行补逗号，变更记录更清晰
docstring-code-format = true   # 自动格式化 docstring 文档中的代码块示例
                                # 保持文档内示例代码与项目整体代码风格一致，避免文档代码风格分裂

# ==============================================================================
# Complexipy 复杂度检测配置
# 补齐 Ruff 缺失维度：认知复杂度；行数/函数数由 tools.quality_metrics 以 AST
# 独立测量（complexipy 8 不再输出行数）。质量门禁阈值以 quality-gate.toml 为准，
# 此处为工具默认值。
# ==============================================================================
[tool.complexipy]
# 扫描范围须与 quality-gate.toml 的 [scan].include_paths 保持一致
paths = [
    "tools",
    "tests",
    "theory",
]
max-complexity-allowed = 15            # 认知复杂度工具默认阈值；最终生效以 quality-gate.toml 为准
output-format = ["json"]               # 输出 JSON 供 tools.ci_quality_gate / complexity_precommit 解析
output = "complexipy-report.json"      # 输出文件路径，与 quality-gate.toml 的 report.json_report_path 保持一致
exclude = ["__pycache__", ".cache"]    # 排除缓存；源码范围与 Ruff/Mypy/门禁扫描对齐
quiet = true                           # 静默模式，减少控制台冗余输出
failed = false                         # 输出全部函数数据而非仅超限函数；是否判失败由门禁脚本按阈值决定
